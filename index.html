<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Sports Live</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f;
  --surface:#0e1219;
  --card:#131820;
  --border:rgba(255,255,255,0.06);
  --accent:#e8ff00;
  --accent2:#ff3d3d;
  --text:#f0f4ff;
  --muted:rgba(240,244,255,0.45);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* HEADER */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(8,10,15,0.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  height:64px;
}
.logo{
  font-family:'Bebas Neue',cursive;
  font-size:26px;letter-spacing:3px;
  color:var(--text);
  display:flex;align-items:center;gap:10px;
}
.logo span{color:var(--accent)}
.live-badge{
  background:var(--accent2);
  color:#fff;font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:4px;letter-spacing:1px;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}

.updated{font-size:11px;color:var(--muted)}

/* HERO STRIP */
.hero{
  padding:48px 24px 32px;
  text-align:center;
  background:linear-gradient(180deg,rgba(232,255,0,0.03) 0%,transparent 100%);
}
.hero h1{
  font-family:'Bebas Neue',cursive;
  font-size:clamp(40px,8vw,96px);
  letter-spacing:6px;
  line-height:1;
  color:var(--text);
}
.hero h1 em{color:var(--accent);font-style:normal}
.hero p{margin-top:12px;color:var(--muted);font-size:14px;letter-spacing:1px}

/* FILTER BAR */
.filter-bar{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:0 24px 24px;
  justify-content:center;
}
.filter-btn{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--muted);
  padding:7px 18px;border-radius:100px;
  font-size:12px;font-weight:600;letter-spacing:0.5px;
  cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;
}
.filter-btn:hover,.filter-btn.active{
  background:var(--accent);color:#000;border-color:var(--accent);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;
  padding:0 24px 60px;
  max-width:1200px;margin:0 auto;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  text-decoration:none;
  color:inherit;
  display:block;
  transition:transform .2s, border-color .2s, box-shadow .2s;
  position:relative;
}
.card:hover{
  transform:translateY(-4px);
  border-color:rgba(232,255,0,0.35);
  box-shadow:0 12px 40px rgba(0,0,0,0.4),0 0 0 1px rgba(232,255,0,0.1);
}
.card-thumb{
  aspect-ratio:16/9;
  background:#0a0d14;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}
.card-thumb::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,0.6));
}
.card-thumb img{
  width:72px;height:72px;
  object-fit:contain;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  transition:transform .25s;
}
.card:hover .card-thumb img{transform:scale(1.08)}

.card-live-dot{
  position:absolute;top:10px;right:10px;z-index:2;
  display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,0.6);
  border-radius:100px;padding:3px 8px;
  font-size:10px;font-weight:700;color:#ff5a5a;letter-spacing:0.5px;
}
.card-live-dot::before{
  content:'';width:6px;height:6px;
  background:#ff3d3d;border-radius:50%;
  animation:pulse 1.2s infinite;
}

.card-body{padding:14px 14px 16px}
.card-name{
  font-size:13px;font-weight:700;
  letter-spacing:0.3px;line-height:1.3;
}
.card-sub{
  font-size:11px;color:var(--muted);margin-top:4px;
}
.card-watch{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:12px;
  background:var(--accent);color:#000;
  font-size:11px;font-weight:700;letter-spacing:0.5px;
  padding:6px 14px;border-radius:100px;
  transition:opacity .2s;
}
.card:hover .card-watch{opacity:0.85}

/* FOOTER */
footer{
  text-align:center;padding:24px;
  font-size:11px;color:var(--muted);
  border-top:1px solid var(--border);
}

/* LOADING */
#loading{
  display:flex;align-items:center;justify-content:center;
  padding:80px 0;gap:12px;color:var(--muted);font-size:14px;
}
.spinner{
  width:20px;height:20px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .hero h1{font-size:42px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px 40px}
  header{padding:0 14px}
  .hero{padding:32px 14px 24px}
  .filter-bar{padding:0 14px 20px}
}
</style>
</head>
<body>

<header>
  <div class="logo">⚡ STAR <span>SPORTS</span></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="live-badge">● LIVE</div>
    <div class="updated" id="updated-time"></div>
  </div>
</header>

<section class="hero">
  <h1>WATCH <em>LIVE</em><br>SPORTS</h1>
  <p>All Star Sports channels · HD Quality · Zero Cost</p>
</section>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-filter="all">All Channels</button>
  <button class="filter-btn" data-filter="hindi">Hindi</button>
  <button class="filter-btn" data-filter="english">English</button>
  <button class="filter-btn" data-filter="tamil">Tamil</button>
  <button class="filter-btn" data-filter="telugu">Telugu</button>
  <button class="filter-btn" data-filter="kannada">Kannada</button>
  <button class="filter-btn" data-filter="select">Select</button>
  <button class="filter-btn" data-filter="khel">Khel</button>
</div>

<div id="loading"><div class="spinner"></div> Fetching channels…</div>
<div class="grid" id="grid" style="display:none"></div>

<footer>Data auto-fetched from live source · Tap any channel to watch</footer>

<script>
const JSON_URL = 'https://sayan-sportlink-sonynetwork.pages.dev/sonyliv.json';

function langTag(name){
  const n = name.toLowerCase();
  if(n.includes('hindi')) return 'hindi';
  if(n.includes('tamil')) return 'tamil';
  if(n.includes('telugu')) return 'telugu';
  if(n.includes('kannada')) return 'kannada';
  if(n.includes('select')) return 'select';
  if(n.includes('khel')) return 'khel';
  return 'english';
}

async function init(){
  try{
    const res = await fetch(JSON_URL + '?_=' + Date.now());
    const data = await res.json();

    // IST live clock
    function updateClock(){
      const now = new Date();
      const ist = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const h = String(ist.getHours()).padStart(2,'0');
      const m = String(ist.getMinutes()).padStart(2,'0');
      const s = String(ist.getSeconds()).padStart(2,'0');
      document.getElementById('updated-time').textContent = h + ':' + m + ':' + s + ' IST';
    }
    updateClock();
    setInterval(updateClock, 1000);
    document.getElementById('loading').style.display = 'none';

    const grid = document.getElementById('grid');
    grid.style.display = 'grid';

    data.channels.forEach(ch => {
      const lang = langTag(ch.name);
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `player.html?id=${ch.id}`;
      card.dataset.lang = lang;
      card.innerHTML = `
        <div class="card-thumb">
          <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22><text y=%2245%22 font-size=%2244%22>📺</text></svg>'">
          <div class="card-live-dot">LIVE</div>
        </div>
        <div class="card-body">
          <div class="card-name">${ch.name}</div>
          <div class="card-sub">${lang.charAt(0).toUpperCase()+lang.slice(1)} · HD</div>
          <div class="card-watch">▶ Watch Now</div>
        </div>`;
      grid.appendChild(card);
    });

    // Filter
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        document.querySelectorAll('.card').forEach(c => {
          c.style.display = (f === 'all' || c.dataset.lang === f) ? 'block' : 'none';
        });
      });
    });

  }catch(e){
    document.getElementById('loading').innerHTML = '<span style="color:#ff5a5a">Failed to load channels. Please refresh.</span>';
  }
}

init();
</script>
</body>
</html>
