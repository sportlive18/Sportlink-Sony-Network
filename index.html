<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Plyr JS -->

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

    /* Custom scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0a0a0a}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ef4444,#f97316);border-radius:4px}

    /* ════════════════════════════════════════════
       TELEGRAM BADGE (top-left, BIG STYLE)
    ════════════════════════════════════════════ */
    #tgBadge{
      position:fixed;
      top:max(14px,env(safe-area-inset-top));
      left:max(14px,env(safe-area-inset-left));
      z-index:10001;
      display:inline-flex;align-items:center;gap:10px;
      padding:11px 20px;
      background:linear-gradient(135deg,#1e88e5,#1565c0);
      color:#fff;
      font-size:15px;
      font-weight:600;
      letter-spacing:.3px;
      text-decoration:none;
      border-radius:12px;
      box-shadow:0 4px 14px rgba(0,0,0,0.5);
      transition:transform .2s ease,box-shadow .2s ease;
      -webkit-tap-highlight-color:transparent;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    }
    #tgBadge:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(30,136,229,0.55)}
    #tgBadge:active{transform:scale(.97)}
    #tgBadge svg{width:20px;height:20px;flex-shrink:0;fill:#fff}
    #tgBadge span{white-space:nowrap}

    /* ─── Z-INDEX SCALE (higher = on top) ───
       #player-container   → 9997
       #channel-list       → 9998
       .player-toolbar     → 9999
       #status             → 9999
       #overlay            → 10000
       #tgBadge            → 10001
       #tgOverlay          → 999999
    ──────────────────────────────────────── */

    /* Overlay */
    #overlay{position:fixed;inset:0;background:#0a0a0a;z-index:10000;
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
    #overlay svg{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #overlay p{color:#555;font-size:13px;letter-spacing:.4px;
      text-align:center;padding:0 24px;font-weight:500}

    /* Channel List — pushed below the big badge */
    #channel-list{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9998;
      display:none;
      flex-direction:column;
      overflow:hidden;
      padding:max(76px,calc(env(safe-area-inset-top) + 62px)) 16px max(24px,env(safe-area-inset-bottom));
    }

    #channel-list .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding-bottom:12px;
      border-bottom:1px solid #141414;
      flex-shrink:0;
    }
    #channel-list .header h1{
      color:#fff;
      font-size:18px;
      font-weight:700;
      letter-spacing:.5px;
      background:linear-gradient(135deg,#ef4444,#f97316,#eab308);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    #channel-list .header .subtitle{
      color:#555;
      font-size:10px;
      font-weight:400;
      letter-spacing:.8px;
      text-transform:uppercase;
      background:rgba(255,255,255,0.05);
      padding:4px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.05);
    }
    #channel-list .header .count{
      color:#666;
      font-size:11px;
      font-weight:500;
    }

    /* Category filter */
    #category-filter{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:12px 0 12px 0;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      flex-shrink:0;
      border-bottom:1px solid rgba(255,255,255,0.03);
    }
    #category-filter::-webkit-scrollbar{display:none}
    .filter-pill{
      flex-shrink:0;
      padding:6px 16px;
      border-radius:20px;
      font-size:10px;
      font-weight:600;
      letter-spacing:.3px;
      text-transform:uppercase;
      cursor:pointer;
      background:#111;
      color:#666;
      border:1px solid #1a1a1a;
      transition:all .25s;
      white-space:nowrap;
    }
    .filter-pill:hover{
      background:#1a1a1a;
      color:#aaa;
      transform:translateY(-1px);
    }
    .filter-pill.active{
      background:linear-gradient(135deg,#ef4444,#f97316);
      color:#fff;
      border-color:transparent;
      box-shadow:0 4px 15px rgba(239,68,68,0.3);
    }

    /* Grid wrapper */
    #grid-wrapper{
      flex:1;
      overflow-y:auto;
      overflow-x:hidden;
      padding-top:12px;
      margin:0 -4px;
      padding-right:4px;
    }
    #grid-wrapper::-webkit-scrollbar{width:4px}
    #grid-wrapper::-webkit-scrollbar-track{background:transparent}
    #grid-wrapper::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ef4444,#f97316);border-radius:4px}

    #ch-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:14px;
    }

    .ch-card{
      background:linear-gradient(145deg,#111,#0d0d0d);
      border:1px solid #1a1a1a;
      border-radius:14px;
      padding:16px 12px;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:10px;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color:transparent;
      min-height:130px;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    .ch-card::before{
      content:'';
      position:absolute;
      inset:0;
      border-radius:14px;
      padding:1px;
      background:linear-gradient(135deg,transparent,transparent);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      transition:all .4s;
    }
    .ch-card:hover{
      transform:translateY(-3px);
      border-color:#ef4444;
      box-shadow:0 8px 30px rgba(239,68,68,0.15);
    }
    .ch-card:hover::before{
      background:linear-gradient(135deg,#ef4444,#f97316,#eab308);
    }
    .ch-card:active{
      transform:scale(.96);
    }
    .ch-card:focus-visible{
      outline:2px solid #ef4444;
      outline-offset:2px;
    }

    .ch-card .category-badge{
      position:absolute;
      top:8px;
      right:8px;
      font-size:7px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.5px;
      padding:2px 8px;
      border-radius:8px;
      background:rgba(255,255,255,0.06);
      color:#666;
      border:1px solid rgba(255,255,255,0.04);
    }

    .ch-card .ch-logo{
      width:100%;
      max-width:110px;
      height:auto;
      max-height:55px;
      object-fit:contain;
      border-radius:6px;
      padding:4px;
      transition:transform .3s;
    }
    .ch-card:hover .ch-logo{
      transform:scale(1.05);
    }

    .ch-card .ch-name{
      color:#e0e0e0;
      font-size:12px;
      font-weight:600;
      line-height:1.3;
      letter-spacing:.2px;
    }

    .ch-card .ch-placeholder{
      width:100%;
      max-width:110px;
      height:55px;
      background:linear-gradient(135deg,#1a1a1a,#111);
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#333;
      font-size:14px;
      font-weight:700;
      letter-spacing:1px;
      border:1px solid #1a1a1a;
    }
    .ch-card .ch-placeholder .initials{
      background:linear-gradient(135deg,#ef4444,#f97316);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    /* Player */
    #player-container{
      position:fixed;
      inset:0;
      background:#000;
      z-index:9997;
      display:none;
      align-items:center;
      justify-content:center;
    }
    #player-container video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }
    .plyr{
      height:100%;
      width:100%;
      background:#000;
    }
    .plyr__controls{
      background:linear-gradient(0deg,rgba(0,0,0,0.9),transparent)!important;
    }
    .plyr__control--overlaid{
      background:linear-gradient(135deg,#ef4444,#f97316)!important;
    }
    .plyr__control.plyr__control--overlaid:hover{
      background:linear-gradient(135deg,#dc2626,#ea580c)!important;
    }
    .plyr__control[data-plyr="play"]:hover,
    .plyr__control[data-plyr="fullscreen"]:hover{
      background:rgba(239,68,68,0.2)!important;
    }
    .plyr__progress__buffer{
      background:rgba(239,68,68,0.3)!important;
    }
    .plyr__progress__played{
      background:linear-gradient(90deg,#ef4444,#f97316)!important;
    }
    .plyr__menu__container .plyr__control[role="menuitemradio"][aria-checked="true"]::before{
      background:linear-gradient(135deg,#ef4444,#f97316)!important;
    }

    /* ══ PLAYER TOP-LEFT TOOLBAR (shifted below badge) ══ */
    .player-toolbar{
      position:fixed;
      top:calc(max(14px,env(safe-area-inset-top)) + 62px);
      left:max(12px,env(safe-area-inset-left));
      z-index:9999;
      display:none;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
      max-width:calc(100vw - 24px);
      pointer-events:none;
    }
    .player-toolbar.show{display:flex}
    .player-toolbar > *{pointer-events:auto}

    /* Back button */
    .back-btn{
      padding:6px 12px;
      background:rgba(0,0,0,0.8);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;
      color:#fff;
      font-size:11px;
      font-weight:500;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:5px;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transition:all .25s;
      font-family:inherit;
      -webkit-tap-highlight-color:transparent;
    }
    .back-btn:hover{
      background:rgba(239,68,68,0.2);
      border-color:#ef4444;
    }
    .back-btn:active{transform:scale(.95)}
    .back-btn svg{
      width:14px;
      height:14px;
      flex-shrink:0;
    }

    /* Social pills — small, next to Back */
    .social-link{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:6px 10px;
      background:rgba(0,0,0,0.8);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;
      color:#fff;
      font-size:11px;
      font-weight:600;
      text-decoration:none;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transition:all .25s;
      white-space:nowrap;
      -webkit-tap-highlight-color:transparent;
    }
    .social-link:hover{
      background:rgba(239,68,68,0.2);
      border-color:#ef4444;
    }
    .social-link:active{transform:scale(.95)}
    .social-link svg{
      width:13px;
      height:13px;
      flex-shrink:0;
    }
    .social-link.tg-link svg{fill:#29b6f6}
    .social-link.wa-link svg{fill:#25D366}

    #status{
      position:fixed;
      top:calc(max(14px,env(safe-area-inset-top)) + 62px);
      right:max(12px,env(safe-area-inset-right));
      z-index:9999;
      padding:5px 13px;
      background:rgba(8,8,8,.9);
      border:1px solid rgba(255,255,255,.05);
      font-size:11px;
      font-weight:500;
      letter-spacing:.02em;
      border-radius:20px;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s;
      max-width:260px;
      text-align:right;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      color:#ef4444;
    }
    #status.show{opacity:1}
    #status.ok{color:#ef4444}
    #status.warn{color:#fb923c}
    #status.err{color:#f87171}

    @media (max-width:400px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
      .ch-card{min-height:110px;padding:12px 8px}
      .ch-card .ch-logo{max-height:40px}
      .ch-card .ch-name{font-size:10px}
      #channel-list .header h1{font-size:15px}
      .filter-pill{font-size:8px;padding:4px 12px}
      #category-filter{padding:10px 0 10px 0}
      .player-toolbar{gap:4px}
      .back-btn{padding:5px 10px;font-size:10px}
      .back-btn svg{width:12px;height:12px}
      .social-link{padding:5px 8px;font-size:10px;gap:4px}
      .social-link svg{width:11px;height:11px}
      /* Slightly smaller badge, still prominent */
      #tgBadge{padding:9px 15px;font-size:13px;gap:8px}
      #tgBadge svg{width:17px;height:17px}
    }
    @media (max-width:340px){
      .social-link span{display:none}
      .social-link{padding:5px 7px}
      #tgBadge span{display:none}
      #tgBadge{padding:9px 12px}
    }
    @media (min-width:768px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
      .ch-card{min-height:150px;padding:20px 16px}
      .ch-card .ch-logo{max-height:65px}
      .ch-card .ch-name{font-size:14px}
    }

    /* ════════════════════════════════════════════
       TELEGRAM POPUP
    ════════════════════════════════════════════ */
    #tgOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 20px;
      animation: fadeInPopup 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    #tgOverlay.show { display: flex; }

    #tgCard {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(160deg, #121821, #0a0c0f);
      border: 1px solid rgba(79, 195, 247, 0.15);
      border-radius: 24px;
      padding: 36px 28px 28px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(79, 195, 247, 0.03);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    #tgCard::before {
      content: "";
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(79, 195, 247, 0.04), transparent 60%);
      pointer-events: none;
    }
    #tgIcon {
      width: 72px; height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2AABEE, #229ED9);
      box-shadow: 0 0 40px rgba(42, 171, 238, 0.2);
      position: relative;
      z-index: 1;
    }
    #tgIcon svg { width: 36px; height: 36px; }

    #tgCard h2 {
      margin: 0 0 8px;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      font-weight: 700;
      color: #ffffff;
      position: relative;
      z-index: 1;
      letter-spacing: -0.01em;
    }
    #tgCard p {
      margin: 0 0 24px;
      color: #8e9baf;
      font-size: clamp(0.9rem, 1.2vw, 1.05rem);
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }
    .tgBtns { display: flex; gap: 12px; position: relative; z-index: 1; }
    .tgBtn {
      flex: 1;
      height: 48px;
      border-radius: 40px;
      font-weight: 700;
      font-size: clamp(0.85rem, 1vw, 1rem);
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      font-family: inherit;
      letter-spacing: 0.01em;
    }
    #joinNow {
      background: linear-gradient(135deg, #4fc3f7, #2196f3);
      color: #ffffff;
      box-shadow: 0 6px 24px rgba(79, 195, 247, 0.25);
    }
    #joinNow:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(79, 195, 247, 0.35);
    }
    #joinedBtn {
      background: rgba(255, 255, 255, 0.05);
      color: #8e9baf;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #joinedBtn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    @keyframes fadeInPopup {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @media (max-width: 480px) {
      #tgCard { padding: 24px 18px 20px; border-radius: 20px; }
      #tgIcon { width: 60px; height: 60px; }
      #tgIcon svg { width: 30px; height: 30px; }
      #tgCard h2 { font-size: 1.2rem; }
      #tgCard p { font-size: 0.85rem; margin-bottom: 18px; }
      .tgBtn { height: 42px; font-size: 0.8rem; }
    }
  </style>
</head>

<!-- Channel List -->
<div id="channel-list">
  <div class="header">
    <h1>⚡ SPORTLINK</h1>
    <span class="subtitle">Sony LIV</span>
  </div>
  <div id="category-filter"></div>
  <div id="grid-wrapper">
    <div id="ch-grid"></div>
  </div>
</div>

<!-- Player Container -->
<div id="player-container">
  <video id="player" playsinline webkit-playsinline controls preload="metadata"></video>
</div>

<!-- ====== TELEGRAM POPUP ====== -->
<div id="tgOverlay">
  <div id="tgCard">
    <div id="tgIcon">
      <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
        <path d="M23.05 2.1L19.6 21.3c-.26 1.15-.94 1.43-1.9.9l-5.26-3.88-2.54 2.45c-.28.28-.52.52-1.06.52l.38-5.4L19.9 5.8c.46-.4-.1-.63-.72-.23L7.5 13.03l-5.24-1.64c-1.14-.36-1.16-1.14.24-1.68L21.6.9c.95-.36 1.78.23 1.45 1.2z"/>
      </svg>
    </div>
    <h2>Join Telegram Channel</h2>
    <p>Get match links &amp; live updates delivered straight to your phone.</p>
    <div class="tgBtns">
      <button class="tgBtn" id="joinedBtn">Already Joined</button>
      <button class="tgBtn" id="joinNow">Join Now</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

// ============ CONFIG ============
var M3U_URL = "https://sportlink-jtv.pages.dev/sony3.m3u";
var PROXY_BASE = "https://sportlink-sonyliv10.pages.dev/api/proxy?u=";

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status = document.getElementById("status");
var $list = document.getElementById("channel-list");
var $grid = document.getElementById("ch-grid");
var $gridWrapper = document.getElementById("grid-wrapper");
var $filter = document.getElementById("category-filter");
var $playerContainer = document.getElementById("player-container");
var $video = document.getElementById("player");
var $backBtn = document.getElementById("backBtn");
var $toolbar = document.getElementById("playerToolbar");
var _stTmr = null;
var allChannels = [];
var currentCategory = 'All';
var currentPlayer = null;
var currentHls = null;
var resumeTmr = null;

function toast(msg,type,dur){
  $status.textContent=msg;
  $status.className="show "+(type||"ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur!==0){
    _stTmr=setTimeout(function(){
      $status.className=$status.className.replace("show","").trim();
      _stTmr=null;
    },dur||4000);
  }
}

function setMsg(m) { $loadMsg && ($loadMsg.textContent = m); }
function hideOverlay() { $overlay && ($overlay.style.display = "none"); }
function getChId() { return new URLSearchParams(location.search).get("id") || ""; }

// ============ PROXY HELPER ============
function proxyUrl(url){
  if(!url) return url;
  if(url.indexOf(PROXY_BASE) === 0) return url;
  return PROXY_BASE + encodeURIComponent(url);
}

// ============ M3U PARSER ============
function parseM3U(text){
  var channels = [];
  var lines = text.split(/\r?\n/);
  var current = null;

  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;

    if(line.indexOf("#EXTINF:") === 0){
      var info = line.substring(8);
      var commaIdx = info.indexOf(",");
      var name = commaIdx >= 0 ? info.substring(commaIdx+1).trim() : "Unknown";
      var attrs = commaIdx >= 0 ? info.substring(0,commaIdx) : info;

      var id = "";
      var logo = "";
      var group = "General";

      var idMatch = attrs.match(/tvg-id="([^"]*)"/i);
      if(idMatch) id = idMatch[1];

      var logoMatch = attrs.match(/tvg-logo="([^"]*)"/i) || attrs.match(/logo="([^"]*)"/i);
      if(logoMatch) logo = logoMatch[1];

      var groupMatch = attrs.match(/group-title="([^"]*)"/i);
      if(groupMatch) group = groupMatch[1] || "General";

      var safeId = id || (name.replace(/[^a-z0-9]+/gi,"_").toLowerCase() + "_" + channels.length);

      current = {
        id: safeId,
        name: name,
        logo: logo,
        category: group,
        stream_url: ""
      };
    }
    else if(line.charAt(0) === "#"){
      if(line.indexOf("#EXTGRP:") === 0 && current){
        var g = line.substring(8).trim();
        if(g) current.category = g;
      }
      continue;
    }
    else if(current){
      current.stream_url = line;
      channels.push(current);
      current = null;
    }
  }

  return channels;
}

// ============ LOAD DATA ============
async function loadData(){
  var r = await fetch(M3U_URL, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  var text = await r.text();
  var channels = parseM3U(text);

  channels = channels.filter(function(c){ return c.stream_url && c.stream_url.length > 0; });

  if(!channels.length) throw new Error("No channels found");
  return { channels: channels };
}

// ============ RENDER FILTERS ============
function renderFilters(channels){
  var categories = ['All'];
  var cats = {};
  channels.forEach(function(ch){
    if(ch.category && ch.category !== 'General') {
      cats[ch.category] = true;
    }
  });
  Object.keys(cats).sort().forEach(function(c){ categories.push(c); });

  var f = document.createDocumentFragment();
  categories.forEach(function(cat){
    var pill = document.createElement('span');
    pill.className = 'filter-pill' + (cat === currentCategory ? ' active' : '');
    pill.textContent = cat;
    pill.dataset.category = cat;
    pill.addEventListener('click', function(){
      currentCategory = cat;
      document.querySelectorAll('.filter-pill').forEach(function(p){
        p.classList.toggle('active', p.dataset.category === cat);
      });
      renderChannels(channels);
      if($gridWrapper) $gridWrapper.scrollTop = 0;
    });
    f.appendChild(pill);
  });
  $filter.innerHTML = '';
  $filter.appendChild(f);
}

// ============ RENDER CHANNELS ============
function renderChannels(channels){
  var filtered = channels;
  if(currentCategory !== 'All') {
    filtered = channels.filter(function(ch){ return ch.category === currentCategory; });
  }

  var countEl = document.querySelector('.header .count');
  if(!countEl) {
    var header = document.querySelector('.header');
    var count = document.createElement('span');
    count.className = 'count';
    header.appendChild(count);
  }
  document.querySelector('.header .count').textContent = filtered.length + ' channels';

  var f = document.createDocumentFragment();
  filtered.forEach(function(ch){
    var a = document.createElement("a");
    a.className = "ch-card";
    a.href = "?id=" + encodeURIComponent(ch.id);

    var badgeHtml = '';
    if(ch.category && ch.category !== 'General') {
      badgeHtml = '<span class="category-badge">'+ch.category+'</span>';
    }

    var logoHtml = '';
    if(ch.logo && ch.logo.trim()) {
      logoHtml = '<img class="ch-logo" src="'+ch.logo+'" alt="'+ch.name+'" loading="lazy" onerror="this.style.display=\'none\'">';
    } else {
      var initials = ch.name.split(' ').slice(0,2).map(function(w){ return w[0]; }).join('');
      logoHtml = '<div class="ch-placeholder"><span class="initials">'+initials+'</span></div>';
    }

    a.innerHTML = badgeHtml + logoHtml + '<span class="ch-name">'+ch.name+'</span>';
    f.appendChild(a);
  });

  $grid.innerHTML = '';
  $grid.appendChild(f);
}

// ============ RENDER LIST ============
function renderList(data){
  hideOverlay();
  var channels = data.channels || data;
  allChannels = channels;
  renderFilters(channels);
  renderChannels(channels);
  $list.style.display = "flex";
}

// ============ PLAYER SHOW / HIDE ============
function showPlayer(){
  $list.style.display = "none";
  $playerContainer.style.display = "flex";
  $toolbar.classList.add("show");
}

function hidePlayer(){
  $list.style.display = "flex";
  $playerContainer.style.display = "none";
  $toolbar.classList.remove("show");

  if(resumeTmr) { clearInterval(resumeTmr); resumeTmr = null; }

  if(currentHls) {
    try { currentHls.destroy(); } catch(e){}
    currentHls = null;
  }
  if(currentPlayer) {
    try { currentPlayer.destroy(); } catch(e){}
    currentPlayer = null;
  }
  try {
    $video.pause();
    $video.removeAttribute('src');
    $video.load();
  } catch(e){}

  if(window.history && window.history.pushState) {
    window.history.pushState({}, document.title, window.location.pathname);
  }
}

// ============ PLAYER SETUP ============
function setupHLSPlayer(url){
  showPlayer();
  toast("Loading stream…", "warn", 0);

  if(currentHls) {
    try { currentHls.destroy(); } catch(e){}
    currentHls = null;
  }
  if(currentPlayer) {
    try { currentPlayer.destroy(); } catch(e){}
    currentPlayer = null;
  }

  var playUrl = proxyUrl(url);

  var defaultOptions = {
    controls: [
      'play', 'progress', 'current-time', 'mute', 'volume',
      'captions', 'settings', 'fullscreen'
    ],
    settings: ['quality'],
    autoplay: true,
    muted: true
  };

  var isM3U8 = /\.m3u8(\?|$)/i.test(url) || url.indexOf('.m3u8') !== -1;

  if(Hls.isSupported() && isM3U8) {
    var hls = new Hls({
      autoStartLoad: true,
      enableWorker: true,
      lowLatencyMode: true,
      backbufferLength: 30,
      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 6,
      levelLoadingTimeOut: 20000,
      fragLoadingTimeOut: 30000
    });
    currentHls = hls;

    hls.loadSource(playUrl);
    hls.attachMedia($video);

    hls.on(Hls.Events.MANIFEST_PARSED, function(_, data) {
      var qualities = data.levels.map(function(l) { return l.height; })
        .filter(function(h){ return h; })
        .sort(function(a,b){ return b-a; });

      qualities = qualities.filter(function(v,i){ return qualities.indexOf(v) === i; });

      currentPlayer = new Plyr($video, Object.assign({}, defaultOptions, qualities.length ? {
        quality: {
          default: qualities[0],
          options: qualities,
          forced: true,
          onChange: function(q) {
            hls.levels.forEach(function(level, index) {
              if(level.height === q) {
                hls.currentLevel = index;
              }
            });
          }
        }
      } : {}));

      $video.play().catch(function(){});
      hideOverlay();
      toast("● Live", "ok", 3000);
    });

    hls.on(Hls.Events.ERROR, function(_, data) {
      if(data.fatal) {
        toast("Reconnecting…", "warn", 0);
        setTimeout(function(){
          try {
            if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else { hls.destroy(); setupHLSPlayer(url); }
          } catch(e){}
        }, 2000);
      }
    });

  } else if($video.canPlayType("application/vnd.apple.mpegurl") && isM3U8) {
    $video.src = playUrl;
    $video.addEventListener("loadedmetadata", function onMeta(){
      $video.removeEventListener("loadedmetadata", onMeta);
      currentPlayer = new Plyr($video, defaultOptions);
      $video.play().catch(function(){});
      hideOverlay();
      toast("● Live", "ok", 3000);
    });
    $video.addEventListener("error", function(){
      toast("Stream error", "err", 0);
    });
  } else {
    $video.src = playUrl;
    currentPlayer = new Plyr($video, defaultOptions);
    $video.addEventListener("loadedmetadata", function(){
      hideOverlay();
      toast("● Live", "ok", 3000);
    });
    $video.play().catch(function(){});
  }

  if(resumeTmr) clearInterval(resumeTmr);
  resumeTmr = setInterval(function() {
    if($video.paused && $video.readyState > 2) {
      $video.play().catch(function(){});
    }
  }, 3000);

  function unmute() {
    $video.muted = false;
    $video.volume = 1;
    document.removeEventListener("click", unmute);
    document.removeEventListener("touchstart", unmute);
  }
  document.addEventListener("click", unmute);
  document.addEventListener("touchstart", unmute);
}

function errMsg(msg){ setMsg(msg); $overlay.style.display="flex"; toast(msg,"err",0); }

// ============ MAIN ============
async function main(){
  var id = getChId();
  var data;

  try {
    setMsg("Loading channels…");
    data = await loadData();
  } catch(e) {
    console.error(e);
    errMsg("Connection error.");
    return;
  }

  if(!id) {
    renderList(data);
    return;
  }

  var channels = data.channels || data;
  var ch = channels.find(function(c){ return c.id === id; });
  if(!ch) {
    errMsg("Channel not found.");
    return;
  }

  document.title = "SPORTLINK · " + ch.name;
  renderList(data);
  setupHLSPlayer(ch.stream_url);
}

// Back button handler
$backBtn.addEventListener("click", function(){
  hidePlayer();
});

// Handle browser back button
window.addEventListener("popstate", function(e){
  if($playerContainer.style.display === "flex") {
    hidePlayer();
  }
});

// Handle escape key
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && $playerContainer.style.display === "flex") {
    hidePlayer();
  }
});

document.addEventListener("DOMContentLoaded", main);
})();
</script>

<!-- ====== TELEGRAM POPUP SCRIPT ====== -->
<script>
(function () {
  const tgOverlay = document.getElementById('tgOverlay');

  function closePopup() {
    tgOverlay.classList.remove('show');
  }

  // Show popup after 3 seconds
  setTimeout(function () {
    tgOverlay.classList.add('show');
  }, 3000);

  // Join Now → open Telegram link, then close
  document.getElementById('joinNow').onclick = function () {
    window.open('https://t.me/sportlink10', '_blank');
    closePopup();
  };

  // Already Joined → just close
  document.getElementById('joinedBtn').onclick = function () {
    closePopup();
  };

  // Backdrop click → close
  tgOverlay.addEventListener('click', function (e) {
    if (e.target === tgOverlay) {
      closePopup();
    }
  });

  // ESC key → close (only popup; player has its own ESC handler)
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && tgOverlay.classList.contains('show')) {
      closePopup();
    }
  });
})();
</script>
