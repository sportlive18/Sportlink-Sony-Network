<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sportlink IPTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: rgba(255,255,255,0.07);
    --accent: #00e5a0;
    --accent2: #0099ff;
    --text: #e8eaf0;
    --muted: #6b7280;
    --card-hover: #1a1f2e;
    --red: #ff3d57;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  html { scroll-behavior: smooth; }
  
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,12,16,0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .header-inner {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 64px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text);
    line-height: 1;
  }
  .logo-text span { color: var(--accent); }
  
  .search-wrap {
    flex: 1;
    position: relative;
    max-width: 500px;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    width: 16px;
    height: 16px;
  }
  #searchInput {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px 10px 40px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchInput::placeholder { color: var(--muted); }
  #searchInput:focus { border-color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .channel-count {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    white-space: nowrap;
  }
  .channel-count strong { color: var(--accent); }

  /* HERO */
  .hero {
    position: relative;
    padding: 60px 24px 40px;
    text-align: center;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,229,160,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 90px);
    letter-spacing: 4px;
    line-height: 0.95;
    margin-bottom: 16px;
  }
  .hero h1 .hl { color: var(--accent); }
  .hero p {
    color: var(--muted);
    font-size: 15px;
    max-width: 480px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }

  /* FILTERS */
  .filters-bar {
    padding: 0 24px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 1440px;
    margin: 0 auto;
  }
  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }

  /* ALPHABET NAV */
  .alpha-nav {
    padding: 0 24px 20px;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    max-width: 1440px;
    margin: 0 auto;
  }
  .alpha-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 12px;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .alpha-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .alpha-btn.has-items { color: var(--text); }

  /* SECTION LETTER */
  .letter-section { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
  .letter-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 3px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 16px;
    margin-top: 32px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .letter-heading small {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0;
  }

  /* GRID */
  .channel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }

  /* CHANNEL CARD */
  .channel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .channel-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .channel-card:hover {
    background: var(--card-hover);
    border-color: rgba(0,229,160,0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,229,160,0.08);
  }
  .channel-card:hover::before { opacity: 1; }

  .ch-logo {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: contain;
    background: var(--surface2);
    padding: 4px;
    flex-shrink: 0;
  }
  .ch-logo-placeholder {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--surface2), var(--surface));
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--accent);
    flex-shrink: 0;
  }
  .ch-info { text-align: center; width: 100%; }
  .ch-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ch-group {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .live-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--red);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 80px 24px;
    color: var(--muted);
    display: none;
  }
  .no-results svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.3; }
  .no-results h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 60px;
  }
  footer strong { color: var(--accent); }

  /* BACK TO TOP */
  #backTop {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent);
    color: #000;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 20px rgba(0,229,160,0.3);
    z-index: 999;
    transition: transform 0.2s;
  }
  #backTop:hover { transform: translateY(-2px); }

  @media (max-width: 600px) {
    .hero h1 { font-size: 48px; }
    .channel-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .header-inner { gap: 12px; }
    .logo-text { font-size: 18px; }
  }
</style>
</head>

function getInitial(name) {
  const c = name.trim()[0]?.toUpperCase() || '#';
  return /[A-Z]/.test(c) ? c : '#';
}

function buildURL(ch) {
  return 'player.html?url=' + encodeURIComponent(ch.url) + '&name=' + encodeURIComponent(ch.name) + (ch.logo ? '&logo=' + encodeURIComponent(ch.logo) : '');
}

function logoEl(ch) {
  if (ch.logo) {
    return `<img class="ch-logo" src="${ch.logo}" alt="" onerror="this.replaceWith(makePlaceholder('${ch.name}'))">`;
  }
  return `<div class="ch-logo-placeholder">${ch.name[0]?.toUpperCase() || '?'}</div>`;
}

function makePlaceholder(name) {
  const d = document.createElement('div');
  d.className = 'ch-logo-placeholder';
  d.textContent = name[0]?.toUpperCase() || '?';
  return d;
}

function render(channels) {
  const container = document.getElementById('channelContainer');
  const noResults = document.getElementById('noResults');
  const count = document.getElementById('channelCount');

  if (!channels.length) {
    container.innerHTML = '';
    noResults.style.display = 'block';
    count.innerHTML = '<strong>0</strong> Channels';
    return;
  }
  noResults.style.display = 'none';
  count.innerHTML = `<strong>${channels.length}</strong> Channels`;

  // Group by letter
  const byLetter = {};
  channels.forEach(ch => {
    const l = getInitial(ch.name);
    if (!byLetter[l]) byLetter[l] = [];
    byLetter[l].push(ch);
  });

  const letters = Object.keys(byLetter).sort((a,b) => {
    if (a === '#') return 1;
    if (b === '#') return -1;
    return a.localeCompare(b);
  });

  container.innerHTML = letters.map(letter => {
    const chs = byLetter[letter];
    const cards = chs.map(ch => `
      <a class="channel-card" href="${buildURL(ch)}" title="${ch.name}">
        <span class="live-badge">LIVE</span>
        ${ch.logo
          ? `<img class="ch-logo" src="${ch.logo}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
          : ''
        }
        <div class="ch-logo-placeholder" style="${ch.logo ? 'display:none' : ''}">${ch.name[0]?.toUpperCase() || '?'}</div>
        <div class="ch-info">
          <div class="ch-name">${ch.name}</div>
          ${ch.group ? `<div class="ch-group">${ch.group}</div>` : ''}
        </div>
      </a>
    `).join('');

    return `
      <div class="letter-section" id="sec-${letter}">
        <div class="letter-heading">
          ${letter}
          <small>${chs.length} channel${chs.length !== 1 ? 's' : ''}</small>
        </div>
        <div class="channel-grid">${cards}</div>
      </div>
    `;
  }).join('');

  // update alpha nav
  const allLetters = new Set(Object.keys(byLetter));
  document.querySelectorAll('.alpha-btn').forEach(btn => {
    btn.classList.toggle('has-items', allLetters.has(btn.dataset.letter));
  });
}

let activeGroup = 'all';
let searchTerm = '';

function getFiltered() {
  return CHANNELS.filter(ch => {
    const groupOk = activeGroup === 'all' || ch.group === activeGroup;
    const searchOk = !searchTerm || ch.name.toLowerCase().includes(searchTerm);
    return groupOk && searchOk;
  });
}

function update() {
  render(getFiltered());
}

// filters
document.getElementById('filtersBar').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeGroup = btn.dataset.group;
  update();
});

// search
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  update();
});

// alpha nav
document.getElementById('alphaNav').addEventListener('click', e => {
  const btn = e.target.closest('.alpha-btn');
  if (!btn) return;
  const sec = document.getElementById('sec-' + btn.dataset.letter);
  if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// back to top
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => {
  backTop.style.display = window.scrollY > 400 ? 'flex' : 'none';
});
backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

// init
update();
</script>
