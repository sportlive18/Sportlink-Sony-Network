<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player · Star Sports Live</title>
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #ff3e3e;
    --bg: #000;
    --surface: rgba(255, 255, 255, 0.05);
    --glass: rgba(0, 0, 0, 0.6);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Outfit', sans-serif}

.shaka-video-container{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

/* Header/Overlay */
.player-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 15px 25px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: opacity 0.3s ease;
    pointer-events: none;
}
.player-header * { pointer-events: auto; }

.header-left { display: flex; align-items: center; gap: 15px; }
.header-right { display: flex; align-items: center; gap: 10px; }

.back-btn {
    color: white;
    text-decoration: none;
    font-size: 24px;
    background: rgba(255,255,255,0.1);
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
    border: none;
    cursor: pointer;
}

.back-btn:hover { background: var(--primary); transform: scale(1.1); }

.channel-info { display: flex; align-items: center; gap: 12px; }

.channel-logo {
    height: 35px;
    width: auto;
    max-width: 100px;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
}

.channel-name {
    color: white;
    font-weight: 700;
    font-size: 18px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.custom-watermark{
position:absolute;
z-index:40;
pointer-events:none;
top:15%;
right:5%;
font-size:12px;
font-weight:800;
color:rgba(255,255,255,0.12);
letter-spacing: 1px;
user-select:none;
}

/* Loading Overlay */
#loading-overlay{
position:fixed;
inset:0;
z-index:50;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#000;
gap:16px;
transition: opacity 0.5s ease;
}
#loading-overlay.hidden{
opacity:0;
pointer-events:none;
}
.spinner{
width:44px;height:44px;
border:3px solid rgba(255,62,62,0.15);
border-top-color:var(--primary);
border-radius:50%;
animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{font-size:14px;color:rgba(255,255,255,0.6);font-family:'Outfit',sans-serif;letter-spacing:0.5px}

/* --- Blocker --- */
.block-overlay{
position:fixed;
inset:0;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
text-align:center;
}

.block-box{
padding:40px;
max-width:500px;
width:90%;
background:rgba(20, 20, 20, 0.95);
border-radius:16px;
border:1px solid rgba(255, 255, 255, 0.1);
box-shadow:0 20px 50px rgba(0,0,0,0.5);
}

.block-title{ font-size:28px; font-weight:800; color:#fff; margin-bottom:15px; text-transform: uppercase; letter-spacing:1px;}
.block-sub{ font-size:14px; color:rgba(255,255,255,0.6); line-height:1.7; }
.block-sub a{color:var(--primary);text-decoration:none;font-weight:600}

/* Tap to unmute overlay */
#tap-to-unmute {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.3);
    cursor: pointer;
    color: white;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    backdrop-filter: blur(2px);
    flex-direction: column;
    gap: 12px;
}
#tap-to-unmute .icon {
    font-size: 48px;
    opacity: 0.8;
}
#tap-to-unmute.visible { display: flex; }

@media(max-width:700px){
    .player-header { padding: 10px 15px; }
    .channel-name { font-size: 14px; }
    .channel-logo { height: 22px; max-width: 70px; }
    .block-title { font-size: 22px; }
    .block-box { padding: 28px 20px; }
}
</style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-msg">Loading channel…</div>
</div>

<!-- Tap to Unmute -->
<div id="tap-to-unmute">
    <div class="icon">🔊</div>
    <div>Tap to unmute</div>
</div>

<!-- Header -->
<div class="player-header" id="header">
    <div class="header-left">
        <a href="index.html" class="back-btn">←</a>
        <div class="channel-info">
            <img id="ch-logo" src="" alt="" class="channel-logo" onerror="this.style.display='none'">
            <span class="channel-name" id="ch-name">Loading…</span>
        </div>
    </div>
    <div class="header-right">
        <span style="font-family:'Outfit',sans-serif;font-size:20px;color:white;letter-spacing:1px;font-weight:800;">SPORT<span style="color:#ff3e3e;">LINK</span></span>
    </div>
</div>

<!-- Player -->
<div class="shaka-video-container" id="player-container">
    <video id="video" autoplay muted playsinline preload="metadata"></video>
    <div class="custom-watermark">SONYNETWORK-SPORTLINK</div>
</div>

<script>
(function(){
  'use strict';

  // ─── Sandbox Guard ───
  function isSandboxedEnv(){
    try {
      if (window.self === window.top) return false;
      if (window.frameElement && window.frameElement.hasAttribute("sandbox")) return true;
      try { document.domain = document.domain; if (window.frameElement && !window.frameElement.getAttribute("sandbox")) return false; } catch (e) { return true; }
      return false;
    } catch(e) { return true; }
  }

  function triggerBlockScreen(title, message){
    const container = document.getElementById("player-container");
    const video = document.getElementById("video");
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e){}
    const overlay = document.createElement("div");
    overlay.className = "block-overlay";
    overlay.innerHTML = `<div class="block-box"><div class="block-title">${title}</div><div class="block-sub">${message}</div></div>`;
    document.body.appendChild(overlay);
    container.style.display = 'none';
    document.getElementById('header').style.display = 'none';
    document.getElementById('loading-overlay').classList.add('hidden');
  }

  if(isSandboxedEnv()){
    triggerBlockScreen('Access Denied', 'Please open in a standard browser and disable ad-blockers.');
    return;
  }

  // ─── Configuration ───
  const CHANNEL_JSON_URL = 'https://sayan-sportlink-sonynetwork.pages.dev/sonyliv.json';
  const COOKIE_URL = "https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main/cookie.json";

  // ─── DOM refs ───
  const video = document.getElementById('video');
  const container = document.getElementById('player-container');
  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingMsg = document.getElementById('loading-msg');
  const chName = document.getElementById('ch-name');
  const chLogo = document.getElementById('ch-logo');
  const header = document.getElementById('header');
  const tapToUnmute = document.getElementById('tap-to-unmute');

  // ─── Helpers ───
  function getParam(k){ return new URLSearchParams(location.search).get(k); }
  function setLoadingMsg(msg){ if(loadingMsg) loadingMsg.textContent = msg; }
  function showLoading(){ loadingOverlay.classList.remove('hidden'); }
  function hideLoading(){ loadingOverlay.classList.add('hidden'); }

  // ─── Robust Cookie Fetch ───
  async function fetchCookieWithRetry(url, retries = 2) {
    for (let i = 0; i <= retries; i++) {
      try {
        const res = await fetch(url, { 
          cache: "no-store",
          headers: { 'Accept': 'application/json, text/plain, */*' }
        });
        if (!res.ok) continue;
        
        const ct = res.headers.get("Content-Type") || "";
        if (ct.includes("application/json")) {
          const data = await res.json();
          const extracted = extractCookie(data);
          if (extracted) return extracted;
        } else {
          const text = (await res.text()).trim();
          if (text && (text.includes('__hdnea__') || text.includes('cookie'))) {
            // Try to parse as JSON if it looks like one
            try {
              const parsed = JSON.parse(text);
              const extracted = extractCookie(parsed);
              if (extracted) return extracted;
            } catch(e) {
              // Plain text cookie
              if (text.startsWith('__hdnea__=')) return text;
              if (text.includes('__hdnea__')) {
                const match = text.match(/__hdnea__=[^&"'\s]+/);
                if (match) return match[0];
              }
            }
          }
        }
      } catch(e) {
        console.warn(`Cookie fetch attempt ${i+1} failed:`, e);
      }
      // Wait before retry
      if (i < retries) await new Promise(r => setTimeout(r, 500));
    }
    return null;
  }

  function extractCookie(data) {
    // Direct match
    if (typeof data === 'string') {
      if (data.startsWith('__hdnea__=')) return data;
      const match = data.match(/__hdnea__=[^&"'\s]+/);
      if (match) return match[0];
      return null;
    }
    
    if (Array.isArray(data)) {
      for (const item of data) {
        const r = extractCookie(item);
        if (r) return r;
      }
      return null;
    }
    
    if (data && typeof data === 'object') {
      // Check common keys directly
      const keys = ['cookie', '__hdnea__', 'Cookie', 'cookies', 'hdnea'];
      for (const key of keys) {
        if (data[key] !== undefined && data[key] !== null) {
          const val = String(data[key]).trim();
          if (val) {
            if (val.startsWith('__hdnea__=')) return val;
            if (key === '__hdnea__') return '__hdnea__=' + val;
            if (val.includes('__hdnea__')) {
              const match = val.match(/__hdnea__=[^&"'\s]+/);
              if (match) return match[0];
            }
            // If it looks like a cookie string
            if (val.includes('=') && (val.includes('hdnea') || val.includes('exp'))) {
              return val;
            }
          }
        }
      }
      
      // Recursive search through all values
      for (const v of Object.values(data)) {
        if (v && typeof v === 'object') {
          const r = extractCookie(v);
          if (r) return r;
        }
      }
    }
    return null;
  }

  // ─── Main Player Logic ───
  async function init() {
    // Install polyfills
    try {
      shaka.polyfill.installAll();
    } catch(e) {
      console.warn('Polyfill install error:', e);
    }
    
    if(!shaka.Player.isBrowserSupported()) {
      return triggerBlockScreen('Browser Unsupported', 'Please use Chrome, Edge, or Firefox.');
    }

    // ─── 1. Fetch channel data ───
    setLoadingMsg('Loading channel data…');
    showLoading();

    let allChannels = [];
    let targetId = getParam('id');
    
    try {
      const res = await fetch(CHANNEL_JSON_URL + '?_=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allChannels = await res.json();
      
      // Ensure it's an array
      if (!Array.isArray(allChannels)) {
        if (allChannels && typeof allChannels === 'object') {
          // Try to find channels array in the object
          const possibleArrays = Object.values(allChannels).filter(v => Array.isArray(v) && v.length > 0);
          if (possibleArrays.length > 0) {
            allChannels = possibleArrays[0];
          } else {
            allChannels = [allChannels];
          }
        } else {
          allChannels = [];
        }
      }
    } catch(e) {
      console.error('Channel fetch error:', e);
      return triggerBlockScreen('Connection Error', 'Could not load channel list.<br><a href="index.html">← Go back</a>');
    }

    if (!allChannels || allChannels.length === 0) {
      return triggerBlockScreen('No Channels', 'Channel list is empty.<br><a href="index.html">← Go back</a>');
    }

    // Find target channel
    let channel = null;
    
    // Try by id
    if (targetId) {
      channel = allChannels.find(c => c.id === targetId);
      if (!channel) channel = allChannels.find(c => c.keyId === targetId);
      if (!channel) channel = allChannels.find(c => String(c.id) === targetId);
    }
    
    // Fallback to first channel
    if (!channel) channel = allChannels[0];
    if (!channel) return triggerBlockScreen('Error', 'No valid channel found.');

    // Update UI
    chName.textContent = channel.name || 'Unknown Channel';
    if (channel.logo) {
      chLogo.src = channel.logo;
      chLogo.style.display = '';
    } else {
      chLogo.style.display = 'none';
    }
    document.title = (channel.name || 'Channel') + ' · Sportlink';

    // ─── 2. Fetch fresh cookie ───
    setLoadingMsg('Fetching stream token…');
    let cookieValue = null;
    
    // First try: fetch from cookies URL
    try {
      cookieValue = await fetchCookieWithRetry(COOKIE_URL);
    } catch(e) {
      console.warn('Cookie fetch error:', e);
    }
    
    // Second try: channel.cookie or channel.cookies
    if (!cookieValue && channel.cookie) {
      cookieValue = channel.cookie;
    }
    if (!cookieValue && channel.cookies) {
      const extracted = extractCookie(channel.cookies);
      if (extracted) cookieValue = extracted;
    }
    
    // Third try: check if channel has a direct __hdnea__ field
    if (!cookieValue && channel.__hdnea__) {
      cookieValue = '__hdnea__=' + channel.__hdnea__;
    }
    
    // Final fallback: attempt to extract from any field in channel
    if (!cookieValue) {
      const extracted = extractCookie(channel);
      if (extracted) cookieValue = extracted;
    }

    // If still no cookie, use a fallback (but warn)
    if (!cookieValue) {
      console.warn('No cookie found, using fallback (may expire)');
      // This is a demo fallback – you should update this regularly or use a real source
      cookieValue = "__hdnea__=st=1786857815~exp=1786879415~acl=/*~hmac=5c8d5bacc480fa3dc24a5ad4d78030c7267b56706c46dfdd6e6aa24863282801";
    }

    // Clean cookie: ensure it starts with __hdnea__= if it's a bare token
    if (cookieValue && !cookieValue.startsWith('__hdnea__=') && !cookieValue.includes(';')) {
      cookieValue = '__hdnea__=' + cookieValue;
    }

    // ─── 3. Setup Shaka Player ───
    setLoadingMsg('Starting stream…');
    
    const player = new shaka.Player(video);
    
    // ─── 4. DRM Config ───
    const drmConfig = {};
    if (channel.keyId && channel.key) {
      drmConfig.clearKeys = { [channel.keyId]: channel.key };
    }
    // Also check for keyId/key in different formats
    if (!drmConfig.clearKeys && channel.kid && channel.k) {
      drmConfig.clearKeys = { [channel.kid]: channel.k };
    }
    
    player.configure({
      drm: drmConfig,
      manifest: { 
        defaultPresentationDelay: 5,
        disableAudio: false,
        disableVideo: false
      },
      streaming: { 
        lowLatencyMode: true, 
        bufferingGoal: 15, 
        rebufferingGoal: 3,
        safeSeekOffset: 5,
        retryParameters: {
          maxAttempts: 5,
          timeout: 10000
        }
      },
      abr: {
        enabled: true,
        defaultBandwidthEstimate: 10000000,
        switchInterval: 2
      }
    });

    // ─── 5. Request Filter with Cookie ───
    const streamUrl = channel.streamUrl || channel.url || channel.stream || channel.manifest;
    if (!streamUrl) {
      return triggerBlockScreen('Error', 'No stream URL available for this channel.<br><a href="index.html">← Back</a>');
    }

    // Extract the hdnea token without the prefix for URL params
    let hdneaToken = cookieValue;
    if (hdneaToken && hdneaToken.startsWith('__hdnea__=')) {
      hdneaToken = hdneaToken.substring(10);
    }

    const netEngine = player.getNetworkingEngine();
    if (netEngine) {
      netEngine.clearAllRequestFilters();
      netEngine.registerRequestFilter((type, request) => {
        // Always set headers
        request.headers["Referer"] = "https://www.jiotv.com/";
        request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        request.headers["Origin"] = "https://www.jiotv.com";
        
        if (cookieValue) {
          request.headers["Cookie"] = cookieValue;
        }
        
        // Add __hdnea__ to URL for manifest and segment requests if not already present
        const isManifestOrSegment = (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || 
                                     type === shaka.net.NetworkingEngine.RequestType.SEGMENT);
        if (isManifestOrSegment && hdneaToken && !request.uris[0].includes("__hdnea__")) {
          const sep = request.uris[0].includes("?") ? "&" : "?";
          request.uris[0] += sep + "__hdnea__=" + hdneaToken;
        }
      });
    }

    // ─── 6. Error handling ───
    player.addEventListener('error', (event) => {
      console.error('Shaka error:', event.detail);
      const error = event.detail;
      let msg = 'Playback error';
      if (error.code === 1002 || error.code === 1003) {
        msg = 'Stream unavailable or expired. Please try again later.';
      } else if (error.code === 1000 || error.code === 1001) {
        msg = 'Network error. Check your connection.';
      } else if (error.code === 2000 || error.code === 2001) {
        msg = 'DRM/decryption error. The stream may require a valid token.';
      }
      triggerBlockScreen('Playback Error', msg + '<br><a href="index.html">← Back to channels</a>');
    });

    // ─── 7. Load and Play ───
    try {
      // Load the manifest
      await player.load(streamUrl);
      
      // Hide loading overlay
      hideLoading();
      
      // Try to play
      try {
        await video.play();
        // If we get here, autoplay worked
        video.muted = false;
      } catch (playError) {
        // Autoplay was blocked – show tap-to-unmute
        console.warn('Autoplay blocked, showing tap-to-unmute:', playError);
        tapToUnmute.classList.add('visible');
        
        // Wait for user interaction
        const unmutePromise = new Promise((resolve) => {
          const handler = async () => {
            tapToUnmute.classList.remove('visible');
            try {
              video.muted = false;
              await video.play();
            } catch(e) {
              console.warn('Play still blocked:', e);
            }
            resolve();
          };
          tapToUnmute.addEventListener('click', handler, { once: true });
          // Also listen to any click on the video
          video.addEventListener('click', handler, { once: true });
        });
        await unmutePromise;
      }
      
      // Header auto-hide
      let hideTimeout;
      const showHeader = () => {
        header.style.opacity = '1';
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => { header.style.opacity = '0'; }, 3500);
      };
      container.addEventListener('mousemove', showHeader);
      container.addEventListener('touchstart', showHeader);
      container.addEventListener('click', showHeader);
      showHeader();
      
    } catch(e) {
      console.error('Playback load error:', e);
      // Check if it's a manifest parse error
      if (e.message && e.message.includes('manifest')) {
        triggerBlockScreen('Manifest Error', 'The stream manifest could not be loaded.<br><a href="index.html">← Back to channels</a>');
      } else {
        triggerBlockScreen('Playback Error', 'Stream unavailable right now.<br><a href="index.html">← Back to channels</a>');
      }
    }

    // ─── 8. Cleanup on page unload ───
    window.addEventListener('beforeunload', () => {
      try {
        player.destroy();
      } catch(e) {}
    });
  }

  // ─── Start ───
  // Ensure DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
